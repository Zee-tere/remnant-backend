name: Verify and deploy Remnant backend

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: remnant-backend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run audit:prod
      - run: npm run db:generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --runInBand
      - run: npm run build

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    environment: production
    concurrency:
      group: remnant-backend-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c # v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - name: Capture currently deployed Lambda package
        id: capture_previous
        shell: bash
        run: |
          set -euo pipefail
          code_url="$(aws lambda get-function --function-name remnant-api --query 'Code.Location' --output text)"
          curl --fail --show-error --silent "$code_url" --output ../previous-function.zip
          rollback_key="remnant-api/rollback/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.zip"
          aws s3 cp ../previous-function.zip "s3://remnant-deployments-158128612346/$rollback_key"
          echo "captured=true" >> "$GITHUB_OUTPUT"
          echo "s3_key=$rollback_key" >> "$GITHUB_OUTPUT"
      - name: Apply database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "$DATABASE_URL" ]; then
            DATABASE_URL="$(aws ssm get-parameter --name /remnant/prod/DATABASE_URL --with-decryption --query 'Parameter.Value' --output text)"
          fi
          test -n "$DATABASE_URL"
          echo "::add-mask::$DATABASE_URL"
          export DATABASE_URL
          npm run db:deploy:pooler
      - run: npm prune --omit=dev
      - name: Package Lambda
        run: zip -r ../function.zip dist node_modules package.json package-lock.json prisma
      - run: aws s3 cp ../function.zip s3://remnant-deployments-158128612346/remnant-api/${{ github.sha }}.zip
      - run: aws lambda update-function-code --function-name remnant-api --s3-bucket remnant-deployments-158128612346 --s3-key remnant-api/${{ github.sha }}.zip >/dev/null
      - run: aws lambda wait function-updated --function-name remnant-api
      - name: Configure scheduled workers and maintenance
        shell: pwsh
        run: ./scripts/configure-production-schedules.ps1 -Region us-east-1 -FunctionName remnant-api
      - name: Configure alarms and log retention
        shell: pwsh
        env:
          ALARM_TOPIC_ARN: ${{ secrets.ALARM_TOPIC_ARN }}
        run: |
          if (-not $env:ALARM_TOPIC_ARN) { $env:ALARM_TOPIC_ARN = 'arn:aws:sns:us-east-1:158128612346:remnant-prod-alerts' }
          ./scripts/configure-production-alarms.ps1 -NotificationTopicArn $env:ALARM_TOPIC_ARN -Region us-east-1 -FunctionName remnant-api -ApiId 36yevvooae
      - name: API smoke check
        env:
          API_URL: ${{ secrets.PRODUCTION_API_URL }}
        run: |
          set -euo pipefail
          if [ -z "$API_URL" ]; then API_URL="https://36yevvooae.execute-api.us-east-1.amazonaws.com"; fi
          curl --fail --show-error --silent --retry 5 --retry-all-errors "$API_URL/health" >/dev/null
          curl --fail --show-error --silent --retry 5 --retry-all-errors "$API_URL/listings?limit=1" >/dev/null
      - name: Production configuration verification
        shell: pwsh
        env:
          API_URL: ${{ secrets.PRODUCTION_API_URL }}
        run: |
          if (-not $env:API_URL) { $env:API_URL = 'https://36yevvooae.execute-api.us-east-1.amazonaws.com' }
          ./scripts/verify-production.ps1 -ApiUrl $env:API_URL -FrontendUrl https://remnantmarket.co -Region us-east-1 -FunctionName remnant-api -UploadBucket remnant-uploads-prod
      - name: Restore previous Lambda package after a failed release
        if: failure() && steps.capture_previous.outputs.captured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -n "${{ steps.capture_previous.outputs.s3_key }}"
          aws lambda update-function-code --function-name remnant-api --s3-bucket remnant-deployments-158128612346 --s3-key "${{ steps.capture_previous.outputs.s3_key }}" >/dev/null
          aws lambda wait function-updated --function-name remnant-api
