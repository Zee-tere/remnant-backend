name: Deploy Remnant Backend
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
concurrency:
  group: remnant-backend-production
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - name: Apply database migrations
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MIGRATION_DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          if [[ -z "$MIGRATION_DATABASE_URL" || -z "$MIGRATION_DIRECT_URL" ]]; then
            FUNCTION_ENV="$(aws lambda get-function-configuration \
              --function-name remnant-api \
              --query 'Environment.Variables' \
              --output json)"
            MIGRATION_DATABASE_URL="${MIGRATION_DATABASE_URL:-$(jq -r '.DATABASE_URL // empty' <<<"$FUNCTION_ENV")}"
            MIGRATION_DIRECT_URL="${MIGRATION_DIRECT_URL:-$(jq -r '.DIRECT_URL // .DATABASE_URL // empty' <<<"$FUNCTION_ENV")}"
          fi
          if [[ -z "$MIGRATION_DATABASE_URL" || -z "$MIGRATION_DIRECT_URL" ]]; then
            echo "::error::Database migrations cannot be skipped. Configure DATABASE_URL and DIRECT_URL in repository secrets or the Lambda environment."
            exit 1
          fi
          DATABASE_URL="$MIGRATION_DATABASE_URL"
          DIRECT_URL="$MIGRATION_DIRECT_URL"
          echo "::add-mask::$DATABASE_URL"
          echo "::add-mask::$DIRECT_URL"
          export DATABASE_URL DIRECT_URL
          npx prisma migrate deploy
      - name: Prune dev dependencies
        run: npm prune --omit=dev
      - name: Create deployment package
        run: zip -r ../function.zip dist node_modules package.json package-lock.json prisma
      - name: Upload to S3
        run: aws s3 cp ../function.zip s3://remnant-deployments-158128612346/remnant-api/function.zip
      - name: Update Lambda function
        run: |
          aws lambda update-function-code \
            --function-name remnant-api \
            --s3-bucket remnant-deployments-158128612346 \
            --s3-key remnant-api/function.zip
      - name: Wait for update to complete
        run: aws lambda wait function-updated --function-name remnant-api
